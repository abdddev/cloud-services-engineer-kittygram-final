version: '3'

volumes:
  pg_data:
  static:
  media:

services:
  postgres:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend/
    env_file: .env
    depends_on:
      - postgres
    volumes:
      - static:/static
      - media:/media

  frontend:
    build: ./frontend/
    env_file: .env
    volumes:
      - static:/static

  gateway:
    build: ./nginx/
    ports:
      - "9000:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - static:/static
      - media:/media