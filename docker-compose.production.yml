volumes:
  pg_data:
  static:
  media:

services:
  postgres:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: abludenov/kittygram_backend:latest
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - static:/static
      - media:/media
    restart: always

  frontend:
    image: abludenov/kittygram_frontend:latest
    env_file: .env
    volumes:
      - static:/static
    restart: always

  gateway:
    image: abludenov/kittygram_gateway:latest
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - static:/static
      - media:/media
    restart: always