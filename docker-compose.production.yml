version: '3'

volumes:
  pg_data:
  static:
  media:

services:
  postgres:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always

  backend:
    image: abludenov/kittygram_backend:latest
    env_file: .env
    depends_on:
      - postgres
    volumes:
      - static:/static
      - media:/media
    restart: always

  frontend:
    image: abludenov/kittygram_frontend:latest
    env_file: .env
    volumes:
      - static:/static
    restart: always

  gateway:
    image: abludenov/kittygram_gateway:latest
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - static:/static
      - media:/media
    restart: always